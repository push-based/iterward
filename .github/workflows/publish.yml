name: Publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

# npm trusts this workflow as a trusted publisher (OIDC), so the workflow needs no npm token.
# https://docs.npmjs.com/trusted-publishers
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The npm trusted publisher names this environment, so a run outside it can't publish.
    environment: release
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up dependencies
        uses: ./.github/actions/setup

      - name: Publish packages to npm
        run: npx nx release publish
