name: Setup
description: Set up Node.js and install dependencies
runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        # npm trusted publishing needs npm 11.5.1 or later, which Node.js 24 bundles.
        node-version: 24
        cache: npm
        registry-url: https://registry.npmjs.org

    - name: Install dependencies
      shell: bash
      run: npm ci
      env:
        HUSKY: '0'
